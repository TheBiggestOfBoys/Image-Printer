name: Create Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'  # Adjust to your .NET version
      
      - name: Restore dependencies
        run: dotnet restore "Image Printer.sln"
      
      - name: Build solution
        run: dotnet build "Image Printer.sln" --configuration Release --no-restore
      
      - name: Publish Image Printer GUI
        run: dotnet publish "Image Printer GUI/Image Printer GUI.csproj" --configuration Release --output ./publish/ImagePrinterGUI --no-build
      
      - name: Publish Image Printer WinUI
        run: dotnet publish "Image Printer WinUI/Image Printer WinUI.csproj" --configuration Release --output ./publish/ImagePrinterWinUI --no-build
      
      - name: Create ZIP archives
        run: |
          Compress-Archive -Path ./publish/ImagePrinterGUI/* -DestinationPath ImagePrinterGUI-${{ github.ref_name }}.zip
          Compress-Archive -Path ./publish/ImagePrinterWinUI/* -DestinationPath ImagePrinterWinUI-${{ github.ref_name }}.zip
        shell: pwsh
      
      - name: Extract release notes
        id: extract_notes
        run: |
          $tag = "${{ github.ref_name }}"
          echo "RELEASE_NOTES=Release $tag" >> $env:GITHUB_OUTPUT
        shell: pwsh
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ImagePrinterGUI-${{ github.ref_name }}.zip
            ImagePrinterWinUI-${{ github.ref_name }}.zip
          body: ${{ steps.extract_notes.outputs.RELEASE_NOTES }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
