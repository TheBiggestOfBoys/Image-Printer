name: Create Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-gui:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'  # Adjust to your .NET version
      
      - name: Restore dependencies
        run: dotnet restore "Image Printer.sln"

      - name: Publish Image Printer GUI
        run: dotnet publish "Image Printer GUI/Image Printer GUI.csproj" --configuration Release -p:PublishProfile=ClickOnce.pubxml -p:PublishProtocol=ClickOnce -p:GenerateClickOnceManifests=true -p:Install=true -p:BootstrapperEnabled=true -p:PublishDir="${{ github.workspace }}\publish\ImagePrinterGUI\"

      - name: Create ZIP archives
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          if (-not (Test-Path -Path ./publish/ImagePrinterGUI)) { throw "ClickOnce publish output not found at ./publish/ImagePrinterGUI" }
          if (-not (Test-Path -Path ./publish/ImagePrinterGUI/setup.exe)) { throw "ClickOnce setup.exe not found in ./publish/ImagePrinterGUI" }
          Compress-Archive -Path ./publish/ImagePrinterGUI/* -DestinationPath ./artifacts/ImagePrinterGUI-ClickOnce.zip
        shell: pwsh

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zips-gui
          path: ./artifacts/*.zip

  build-winui:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            rid: win-x86
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'  # Adjust to your .NET version

      - name: Restore dependencies
        run: dotnet restore "Image Printer.sln"

      - name: Publish Image Printer WinUI
        run: dotnet publish "Image Printer WinUI/Image Printer WinUI.csproj" --configuration Release --output ./publish/ImagePrinterWinUI -p:Platform=${{ matrix.platform }} -p:RuntimeIdentifier=${{ matrix.rid }} -p:WindowsPackageType=MSIX -p:GenerateAppxPackageOnBuild=true -p:AppxPackageDir="${{ github.workspace }}\publish\ImagePrinterWinUI\AppxPackages\" -p:AppxBundle=Never

      - name: Create ZIP archive
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          if (-not (Test-Path -Path ./publish/ImagePrinterWinUI/AppxPackages)) { throw "MSIX output not found at ./publish/ImagePrinterWinUI/AppxPackages" }
          Compress-Archive -Path ./publish/ImagePrinterWinUI/AppxPackages/* -DestinationPath ./artifacts/ImagePrinterWinUI-MSIX-${{ matrix.platform }}.zip
        shell: pwsh

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zips-winui-${{ matrix.platform }}
          path: ./artifacts/*.zip

  build-tools:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
          - rid: win-x64
          - rid: win-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'  # Adjust to your .NET version

      - name: Restore dependencies
        run: dotnet restore "Image Printer.sln"

      - name: Decode and import certificate
        run: |
          $pfxBytes = [System.Convert]::FromBase64String("${{ secrets.CERTIFICATE_BASE64 }}")
          $pfxPath = "$env:RUNNER_TEMP\cert.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          $pwd = ConvertTo-SecureString -String "${{ secrets.CERTIFICATE_PASSWORD }}" -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $pwd

          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Publish Image Printer
        run: dotnet publish "Image Printer/Image Printer.csproj" --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true --output ./publish/ImagePrinter-${{ matrix.rid }}

      - name: Publish Image Resizer
        run: dotnet publish "Image Resizer/Image Resizer.csproj" --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true --output ./publish/ImageResizer-${{ matrix.rid }}

      - name: Publish Un Text Filer
        run: dotnet publish "Un Text Filer/Un Text Filer.csproj" --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true --output ./publish/UnTextFiler-${{ matrix.rid }}

      - name: Publish Video Printer
        run: dotnet publish "Video Printer/Video Printer.csproj" --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true --output ./publish/VideoPrinter-${{ matrix.rid }}

      - name: Sign executables
        run: |
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          if (-not (Test-Path $signtool)) {
            Write-Warning "signtool not found, trying to locate..."
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\" -Recurse -Filter "signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          }

          $exeFiles = Get-ChildItem -Path ./publish -Filter "*.exe" -Recurse
          foreach ($exe in $exeFiles) {
            Write-Host "Signing $($exe.FullName)..."
            & $signtool sign /sha1 "${{ env.CERT_THUMBPRINT }}" /fd SHA256 /t http://timestamp.digicert.com $exe.FullName
          }
        shell: pwsh

      - name: Create ZIP archives
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          if (-not (Test-Path -Path ./publish/ImagePrinter-${{ matrix.rid }})) { throw "Image Printer publish output not found" }
          if (-not (Test-Path -Path ./publish/ImageResizer-${{ matrix.rid }})) { throw "Image Resizer publish output not found" }
          if (-not (Test-Path -Path ./publish/UnTextFiler-${{ matrix.rid }})) { throw "Un Text Filer publish output not found" }
          if (-not (Test-Path -Path ./publish/VideoPrinter-${{ matrix.rid }})) { throw "Video Printer publish output not found" }
          Compress-Archive -Path ./publish/ImagePrinter-${{ matrix.rid }}/* -DestinationPath ./artifacts/ImagePrinter-${{ matrix.rid }}.zip
          Compress-Archive -Path ./publish/ImageResizer-${{ matrix.rid }}/* -DestinationPath ./artifacts/ImageResizer-${{ matrix.rid }}.zip
          Compress-Archive -Path ./publish/UnTextFiler-${{ matrix.rid }}/* -DestinationPath ./artifacts/UnTextFiler-${{ matrix.rid }}.zip
          Compress-Archive -Path ./publish/VideoPrinter-${{ matrix.rid }}/* -DestinationPath ./artifacts/VideoPrinter-${{ matrix.rid }}.zip
        shell: pwsh

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zips-tools-${{ matrix.rid }}
          path: ./artifacts/*.zip

  release:
    needs:
      - build-gui
      - build-winui
      - build-tools
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Download ZIP artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: zips-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Release ${{ steps.version.outputs.TAG }}
          files: dist/*.zip
          body: |
            ## Image Printer Suite Release ${{ steps.version.outputs.TAG }}

            ### Downloads by Application Type

            #### GUI Applications
            - **Image Printer GUI (ClickOnce)** - Install and auto-update enabled
            - **Image Printer WinUI (MSIX)** - Modern Windows 11 app with platform-specific packages

            #### Command-Line Tools (Available for x86, x64, ARM64)
            - **Image Printer** - Convert images to ASCII art
            - **Video Printer** - Convert videos to ASCII art  
            - **Image Resizer** - Batch resize images
            - **Un Text Filer** - Text file utilities

            ### Architecture Guide
            - **x64** (64-bit Intel/AMD) - Most common for modern PCs
            - **x86** (32-bit) - For older systems or 32-bit Windows
            - **ARM64** - For ARM-based Windows devices (Surface Pro X, etc.)

            ### Installation

            **ClickOnce (GUI)**: Extract and run `setup.exe`

            **MSIX (WinUI)**: Extract and install the `.msix` package for your architecture

            **Command-Line Tools**: Extract the ZIP and run the `.exe` files directly (self-contained, no .NET required)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
