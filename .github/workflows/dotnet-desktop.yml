name: Create Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-gui:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
          - rid: win-x64
          - rid: win-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet nuget list source
          dotnet restore "Image Printer.slnx" --verbosity detailed
        continue-on-error: false

      - name: Publish Image Printer GUI
        run: dotnet publish "Image Printer GUI/Image Printer GUI.csproj" --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=true --output "Image Printer GUI/bin/Release/net10.0-windows10.0.26100.0/${{ matrix.rid }}/publish" --verbosity normal

      - name: List publish output
        run: |
          Write-Host "Checking for publish output..."
          Get-ChildItem -Path "Image Printer GUI/bin" -Recurse | Select-Object FullName
        shell: pwsh
        continue-on-error: true

      - name: Create ZIP archives
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          $publishPath = "Image Printer GUI/bin/Release/net10.0-windows10.0.26100.0/${{ matrix.rid }}/publish"
          if (-not (Test-Path -Path $publishPath)) { throw "GUI publish output not found at $publishPath" }
          Compress-Archive -Path "$publishPath/*" -DestinationPath ./artifacts/ImagePrinterGUI-${{ matrix.rid }}.zip
        shell: pwsh

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zips-gui-${{ matrix.rid }}
          path: ./artifacts/*.zip

  build-winui:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            rid: win-x86
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet nuget list source
          dotnet restore "Image Printer.slnx" --verbosity detailed
        continue-on-error: false

      - name: Publish Image Printer WinUI
        run: dotnet publish "Image Printer WinUI/Image Printer WinUI.csproj" --configuration Release -p:Platform=${{ matrix.platform }} -p:RuntimeIdentifier=${{ matrix.rid }} --self-contained true --output "Image Printer WinUI/bin/Release/net10.0-windows10.0.26100.0/${{ matrix.platform }}/publish" -p:GenerateAppxPackageOnBuild=true

      - name: List publish output
        run: |
          Write-Host "Checking for WinUI publish output..."
          Get-ChildItem -Path "Image Printer WinUI/bin" -Recurse -Depth 5 -ErrorAction SilentlyContinue | Select-Object FullName
        shell: pwsh
        continue-on-error: true

      - name: Create ZIP archive
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          $publishPath = "Image Printer WinUI/bin/Release/net10.0-windows10.0.26100.0/${{ matrix.platform }}/publish"
          if (-not (Test-Path -Path $publishPath)) { throw "WinUI publish output not found at $publishPath" }
          Compress-Archive -Path "$publishPath/*" -DestinationPath ./artifacts/ImagePrinterWinUI-${{ matrix.platform }}.zip
        shell: pwsh

      - name: Copy MSIX packages
        run: |
          $msixPath = "Image Printer WinUI/AppPackages"
          if (Test-Path -Path $msixPath) {
            Get-ChildItem -Path $msixPath -Filter "*.msix" -Recurse | Copy-Item -Destination ./artifacts/ -Force
          }
        shell: pwsh

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zips-winui-${{ matrix.platform }}
          path: ./artifacts/*.zip

      - name: Upload MSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: msix-winui-${{ matrix.platform }}
          path: ./artifacts/*.msix
        if: always()

  build-tools:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
          - rid: win-x64
          - rid: win-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet nuget list source
          dotnet restore "Image Printer.slnx" --verbosity detailed
        continue-on-error: false

      - name: Decode and import certificate
        run: |
          $pfxBytes = [System.Convert]::FromBase64String("${{ secrets.CERTIFICATE_BASE64 }}")
          $pfxPath = "$env:RUNNER_TEMP\cert.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          $pwd = ConvertTo-SecureString -String "${{ secrets.CERTIFICATE_PASSWORD }}" -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $pwd

          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
        shell: pwsh
        continue-on-error: true

      - name: Publish Image Printer CLI
        run: dotnet publish "Image Printer CLI/Image Printer CLI.csproj" --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true --output "Image Printer CLI/bin/Release/net10.0-windows10.0.26100.0/${{ matrix.rid }}/publish"

      - name: Publish Image Resizer
        run: dotnet publish "Image Resizer/Image Resizer.csproj" --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true --output "Image Resizer/bin/Release/net10.0-windows10.0.26100.0/${{ matrix.rid }}/publish"

      - name: Publish Un Text Filer
        run: dotnet publish "Un Text Filer/Un Text Filer.csproj" --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true --output "Un Text Filer/bin/Release/net10.0-windows10.0.26100.0/${{ matrix.rid }}/publish"

      - name: Publish Video Printer
        run: dotnet publish "Video Printer/Video Printer.csproj" --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true --output "Video Printer/bin/Release/net10.0-windows10.0.26100.0/${{ matrix.rid }}/publish"

      - name: Sign executables
        run: |
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          if (-not (Test-Path $signtool)) {
            Write-Warning "signtool not found, trying to locate..."
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\" -Recurse -Filter "signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          }

          $exeFiles = @(
            "Image Printer CLI/bin/Release/net10.0-windows10.0.26100.0/${{ matrix.rid }}/publish/*.exe",
            "Image Resizer/bin/Release/net10.0-windows10.0.26100.0/${{ matrix.rid }}/publish/*.exe",
            "Un Text Filer/bin/Release/net10.0-windows10.0.26100.0/${{ matrix.rid }}/publish/*.exe",
            "Video Printer/bin/Release/net10.0-windows10.0.26100.0/${{ matrix.rid }}/publish/*.exe"
          )

          foreach ($pattern in $exeFiles) {
            $files = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue
            foreach ($exe in $files) {
              Write-Host "Signing $($exe.FullName)..."
              & $signtool sign /sha1 "${{ env.CERT_THUMBPRINT }}" /fd SHA256 /t http://timestamp.digicert.com $exe.FullName
            }
          }
        shell: pwsh
        if: ${{ env.CERT_THUMBPRINT != '' }}

      - name: Create ZIP archives
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          $basePublishPath = "bin/Release/net10.0-windows10.0.26100.0/${{ matrix.rid }}/publish"

          $projects = @(
            @{ Name = "Image Printer CLI"; Zip = "ImagePrinterCLI-${{ matrix.rid }}.zip" },
            @{ Name = "Image Resizer"; Zip = "ImageResizer-${{ matrix.rid }}.zip" },
            @{ Name = "Un Text Filer"; Zip = "UnTextFiler-${{ matrix.rid }}.zip" },
            @{ Name = "Video Printer"; Zip = "VideoPrinter-${{ matrix.rid }}.zip" }
          )

          foreach ($project in $projects) {
            $publishPath = "$($project.Name)/$basePublishPath"
            if (-not (Test-Path -Path $publishPath)) { 
              throw "$($project.Name) publish output not found at $publishPath" 
            }
            Compress-Archive -Path "$publishPath/*" -DestinationPath "./artifacts/$($project.Zip)"
          }
        shell: pwsh

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zips-tools-${{ matrix.rid }}
          path: ./artifacts/*.zip

  release:
    needs:
      - build-gui
      - build-winui
      - build-tools
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Download ZIP artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: zips-*
          merge-multiple: true

      - name: Download MSIX artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: msix-*
          merge-multiple: true
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Release ${{ steps.version.outputs.TAG }}
          files: |
            dist/*.zip
            dist/*.msix
          body: |
            ## Image Printer Suite Release ${{ steps.version.outputs.TAG }}

            ### Downloads by Application Type

            #### GUI Applications
            - **Image Printer GUI** (ZIP) - WPF-based desktop application for converting images to ASCII art
              - Available for: x86, x64, ARM64
              - Requires: .NET 10 Desktop Runtime
            - **Image Printer WinUI** (MSIX & ZIP) - Modern Windows app with native Windows 11 UI
              - Available for: x86, x64, ARM64
              - MSIX: Double-click to install (recommended)
              - ZIP: Extract and run for portable mode

            #### Command-Line Tools (Available for x86, x64, ARM64)
            - **Image Printer CLI** - Convert images to ASCII art from the command line
            - **Video Printer** - Convert videos to ASCII art frames
            - **Image Resizer** - Batch resize images
            - **Un Text Filer** - Text file utilities

            ### Architecture Guide
            - **x64** (64-bit Intel/AMD) - Most common for modern PCs
            - **x86** (32-bit) - For older systems or 32-bit Windows
            - **ARM64** - For ARM-based Windows devices (Surface Pro X, etc.)

            ### Installation

            **WinUI MSIX Packages**: Double-click the `.msix` file to install. Provides automatic updates and easy uninstall.

            **WinUI ZIP Packages**: Extract the ZIP and run the executable for portable mode (no installation required).

            **GUI Applications**: Extract the ZIP and run the executable. Requires .NET 10 Desktop Runtime.

            **Command-Line Tools**: Extract the ZIP and run the `.exe` files directly (self-contained, no .NET installation required).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
